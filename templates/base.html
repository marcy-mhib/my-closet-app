<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}クロークノート{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="header">
    <div class="logo">
        👗 <span>クロークノート</span>
    </div>
    <div class="nav">
        {% if current_user.is_authenticated %}
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">クローゼット</a>
        <a href="/coordinates" class="{{ 'active' if request.path.startswith('/coordinates') else '' }}">コーディネート</a>
        <a href="/rarely_worn" class="{{ 'active' if request.path == '/rarely_worn' else '' }}">整理チェック</a>
        <a href="/weather" class="{{ 'active' if request.path == '/weather' else '' }}">天気</a>
        <span class="nav-user">{{ current_user.username }}</span>
        <form method="POST" action="/logout" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="nav-logout">ログアウト</button>
        </form>
        {% else %}
        <a href="/login" class="{{ 'active' if request.path == '/login' else '' }}">ログイン</a>
        <a href="/register" class="{{ 'active' if request.path == '/register' else '' }}">新規登録</a>
        {% endif %}
    </div>
</div>

{% block content %}{% endblock %}

<div id="confirm-modal" class="modal-overlay">
    <div class="modal-box">
        <p id="confirm-modal-message">本当に削除しますか？</p>
        <div class="modal-actions">
            <button type="button" class="modal-btn modal-cancel">キャンセル</button>
            <button type="button" class="modal-btn modal-confirm">削除する</button>
        </div>
    </div>
</div>

<script>
let pendingForm = null;

function confirmDelete(form, message) {
    pendingForm = form;
    document.getElementById('confirm-modal-message').textContent = message || '本当に削除しますか？';
    document.getElementById('confirm-modal').classList.add('open');
    return false;
}

document.addEventListener('DOMContentLoaded', function () {
    document.querySelector('.modal-cancel').addEventListener('click', function () {
        pendingForm = null;
        document.getElementById('confirm-modal').classList.remove('open');
    });
    document.querySelector('.modal-confirm').addEventListener('click', function () {
        document.getElementById('confirm-modal').classList.remove('open');
        if (pendingForm) pendingForm.submit();
    });
    document.querySelectorAll('form.validate-form').forEach(function (form) {
        form.addEventListener('submit', function (e) {
            if (!form.checkValidity()) {
                e.preventDefault();
                form.querySelectorAll(':invalid').forEach(function (el) {
                    el.classList.add('invalid');
                    const err = el.parentElement.querySelector('.field-error');
                    if (err) err.classList.add('show');
                });
            }
        });
    });
});
</script>
{% block scripts %}{% endblock %}

</body>
</html>
