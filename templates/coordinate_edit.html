{% extends 'base.html' %}
{% block title %}コーデを編集{% endblock %}
{% block content %}
<div class="main">
    <div class="left">
        <div class="section-header">
            <span class="section-title">コーディネートを編集する</span>
        </div>
        <form method="POST" class="validate-form" id="coordinate-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="padding: 16px 20px 0;">
                <label>コーデ名</label>
                <input type="text" name="name" value="{{ coordinate.name }}" required>
                <span class="field-error">コーデ名を入力してください</span>
            </div>

            {% include '_clothes_picker.html' %}

            <div style="padding: 16px 20px; display:flex; gap:10px;">
                <button type="submit" class="submit-btn">保存する</button>
            </div>
        </form>

        <form method="POST" action="{{ url_for('delete_coordinate', id=coordinate.id) }}" class="inline-form" onsubmit="return confirmDelete(this, 'このコーディネートを削除しますか？')" style="padding: 0 20px 16px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="delete-btn-full">このコーディネートを削除する</button>
        </form>

        <a href="{{ url_for('coordinate_detail', id=coordinate.id) }}" class="back-link">← 戻る</a>
    </div>

    <div class="right">
        <div style="padding: 16px 20px 0;">
            <div class="suggest-label">選んだアイテム</div>
        </div>
        <div id="selected-preview" class="selected-preview">
            <div class="empty-state" id="selected-empty">まだ何も選んでいません</div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const checkboxes = document.querySelectorAll('.pick-checkbox');
    const preview = document.getElementById('selected-preview');
    const emptyMsg = document.getElementById('selected-empty');

    function renderPreview() {
        preview.innerHTML = '';
        const checked = Array.from(checkboxes).filter(function (cb) { return cb.checked; });
        if (!checked.length) {
            preview.appendChild(emptyMsg);
            return;
        }
        checked.forEach(function (cb) {
            const row = document.createElement('div');
            row.className = 'selected-item-row';

            const thumb = document.createElement('div');
            thumb.className = 'selected-item-thumb';
            if (cb.dataset.image) {
                const img = document.createElement('img');
                img.src = cb.dataset.image;
                img.alt = cb.dataset.name;
                thumb.appendChild(img);
            } else {
                thumb.textContent = '👕';
            }

            const name = document.createElement('span');
            name.textContent = cb.dataset.name;

            row.appendChild(thumb);
            row.appendChild(name);
            preview.appendChild(row);
        });
    }

    checkboxes.forEach(function (cb) {
        cb.addEventListener('change', function () {
            cb.closest('.pick-card').classList.toggle('selected', cb.checked);
            renderPreview();
        });
    });

    renderPreview();
});
</script>
{% endblock %}
