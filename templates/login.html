{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="form-container" style="max-width:380px;">
    <h1>ログイン</h1>
    {% if error %}
    <div class="color-warning">{{ error }}</div>
    {% endif %}
    <form method="POST" class="validate-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>ユーザー名</label>
            <input type="text" name="username" required autofocus>
            <span class="field-error">ユーザー名を入力してください</span>
        </div>
        <div class="form-group">
            <label>パスワード</label>
            <input type="password" name="password" required>
            <span class="field-error">パスワードを入力してください</span>
        </div>
        <button type="submit" class="submit-btn">ログイン</button>
    </form>
    <a href="/register" class="back-link">アカウントをお持ちでない方はこちら</a>
</div>
{% endblock %}
