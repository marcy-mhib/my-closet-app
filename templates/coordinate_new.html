{% extends 'base.html' %}
{% block title %}コーデを作成{% endblock %}
{% block content %}
<div class="form-container" style="max-width:700px;">
    <h1>コーディネートを作成する</h1>
    <form method="POST" class="validate-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>コーデ名</label>
            <input type="text" name="name" placeholder="例：休日カジュアル" required>
            <span class="field-error">コーデ名を入力してください</span>
        </div>
        <div class="form-group">
            <label>組み合わせる服を選択</label>
            {% if clothes %}
            <div class="clothes-checklist">
                {% for item in clothes %}
                <label class="clothes-checkbox">
                    <input type="checkbox" name="clothes_ids" value="{{ item.id }}">
                    {{ item.name }}（{{ item.category }}・{{ item.color }}）
                </label>
                {% endfor %}
            </div>
            {% else %}
            <div class="empty-state">先に服を登録してください。</div>
            {% endif %}
        </div>
        <button type="submit" class="submit-btn">保存する</button>
    </form>
    <a href="/coordinates" class="back-link">← 戻る</a>
</div>
{% endblock %}
