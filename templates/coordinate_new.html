{% extends 'base.html' %}
{% block title %}コーデを作成{% endblock %}
{% block content %}
<div class="main">
    <div class="left">
        <div class="section-header">
            <span class="section-title">コーディネートを作成する</span>
        </div>
        <form method="POST" class="validate-form picker-form" id="coordinate-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="padding: 16px 20px 0;">
                <label>コーデ名</label>
                <input type="text" name="name" placeholder="例：休日カジュアル" required>
                <span class="field-error">コーデ名を入力してください</span>
            </div>

            {% include '_clothes_picker.html' %}
        </form>
    </div>

    <div class="right">
        <div style="padding: 16px 20px 0;">
            <div class="suggest-label">選んだアイテム</div>
        </div>
        <div id="selected-preview" class="selected-preview">
            <div class="empty-state" id="selected-empty">まだ何も選んでいません</div>
        </div>
        <div class="coordinate-edit-actions">
            <button type="submit" form="coordinate-form" class="submit-btn small-btn">保存する</button>
            <a href="/coordinates" class="back-link">← 戻る</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const checkboxes = document.querySelectorAll('.pick-checkbox');
    const preview = document.getElementById('selected-preview');
    const emptyMsg = document.getElementById('selected-empty');

    function renderPreview() {
        preview.innerHTML = '';
        const checked = Array.from(checkboxes).filter(function (cb) { return cb.checked; });
        if (!checked.length) {
            preview.appendChild(emptyMsg);
            return;
        }
        checked.forEach(function (cb) {
            const row = document.createElement('div');
            row.className = 'selected-item-row';

            const thumb = document.createElement('div');
            thumb.className = 'selected-item-thumb';
            if (cb.dataset.image) {
                const img = document.createElement('img');
                img.src = cb.dataset.image;
                img.alt = cb.dataset.name;
                thumb.appendChild(img);
            } else {
                thumb.textContent = '👕';
            }

            const name = document.createElement('span');
            name.textContent = cb.dataset.name;

            row.appendChild(thumb);
            row.appendChild(name);
            preview.appendChild(row);
        });
    }

    checkboxes.forEach(function (cb) {
        cb.addEventListener('change', function () {
            cb.closest('.pick-card').classList.toggle('selected', cb.checked);
            renderPreview();
        });
    });

    renderPreview();
});
</script>
{% endblock %}
