{% extends 'base.html' %}
{% block title %}服を登録{% endblock %}
{% block content %}
<div class="form-container">
    <h1>服を登録する</h1>
    <form method="POST" enctype="multipart/form-data" class="validate-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>服の名前</label>
            <input type="text" name="name" placeholder="例：白Tシャツ" required>
            <span class="field-error">服の名前を入力してください</span>
        </div>
        <div class="form-group">
            <label>カテゴリ</label>
            <select name="category">
                {% for cat in categories %}
                <option>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>色</label>
            <input type="text" name="color" id="color-input" placeholder="例：白、黒、ネイビー">
        </div>
        <div class="form-group">
            <label>季節</label>
            <select name="season" id="season-select">
                {% for s in seasons %}
                <option>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>購入価格（円・任意）</label>
            <input type="number" name="price" min="0" step="1" placeholder="例：3000">
        </div>
        <div class="form-group">
            <label>画像（複数選択可）</label>
            <input type="file" name="images" id="images-input" accept="image/*" multiple>
            <div id="image-preview" class="image-preview"></div>
            {% if ai_enabled %}
            <button type="button" id="ai-analyze-btn" class="ai-btn">🤖 AIで自動判定</button>
            <span id="ai-status" class="ai-status"></span>
            {% endif %}
        </div>
        <button type="submit" class="submit-btn">登録する</button>
    </form>
    <a href="/" class="back-link">← 戻る</a>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('images-input').addEventListener('change', function (e) {
    const preview = document.getElementById('image-preview');
    preview.innerHTML = '';
    Array.from(e.target.files).forEach(function (file) {
        const reader = new FileReader();
        reader.onload = function (ev) {
            const img = document.createElement('img');
            img.src = ev.target.result;
            preview.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
});

{% if ai_enabled %}
document.getElementById('ai-analyze-btn').addEventListener('click', function () {
    const files = document.getElementById('images-input').files;
    const status = document.getElementById('ai-status');
    if (!files.length) {
        status.textContent = '先に画像を選択してください';
        return;
    }
    status.textContent = '判定中...';
    const formData = new FormData();
    formData.append('image', files[0]);
    formData.append('csrf_token', '{{ csrf_token() }}');
    fetch('/analyze_image', { method: 'POST', body: formData })
        .then(function (res) { return res.json(); })
        .then(function (data) {
            if (data.error) {
                status.textContent = data.error;
                return;
            }
            const categorySelect = document.querySelector('select[name="category"]');
            const seasonSelect = document.getElementById('season-select');
            const colorInput = document.getElementById('color-input');
            if (data.category) categorySelect.value = data.category;
            if (data.season) seasonSelect.value = data.season;
            if (data.color) colorInput.value = data.color;
            status.textContent = '判定結果を反映しました';
        })
        .catch(function () {
            status.textContent = 'AI解析に失敗しました';
        });
});
{% endif %}
</script>
{% endblock %}
