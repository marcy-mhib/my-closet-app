{# 服の登録フォームの画像まわりのJS。PC版とスマホ版で同じ動きにしたいので共通化している。
   スマホ版は「カメラで撮影」「アルバムから選ぶ」の2つのinputを持つため、
   1つのidを見るのではなく .image-input をまとめて扱う作りにしてある。 #}
<script>
(function () {
    const inputs = Array.from(document.querySelectorAll('.image-input'));
    const preview = document.getElementById('image-preview');
    const colorInput = document.getElementById('color-input');
    const colorStatus = document.getElementById('color-status');

    function selectedFiles() {
        for (const input of inputs) {
            if (input.files.length) return input.files;
        }
        return [];
    }

    inputs.forEach(function (input) {
        input.addEventListener('change', function (e) {
            // 撮影とアルバムを選び直したときに、前に選んだほうが送信されないよう空にする
            inputs.forEach(function (other) { if (other !== input) other.value = ''; });

            preview.innerHTML = '';
            Array.from(e.target.files).forEach(function (file) {
                const reader = new FileReader();
                reader.onload = function (ev) {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });

            if (e.target.files.length && !colorInput.value) {
                colorStatus.textContent = '色を解析中...';
                const formData = new FormData();
                formData.append('image', e.target.files[0]);
                formData.append('csrf_token', '{{ csrf_token() }}');
                fetch('/detect_color', { method: 'POST', body: formData })
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (data.error) {
                            colorStatus.textContent = '';
                            return;
                        }
                        colorInput.value = data.color;
                        colorStatus.textContent = '色を自動入力しました（' + data.color + '）';
                    })
                    .catch(function () {
                        colorStatus.textContent = '';
                    });
            }
        });
    });

    {% if ai_enabled %}
    document.getElementById('ai-analyze-btn').addEventListener('click', function () {
        const files = selectedFiles();
        const status = document.getElementById('ai-status');
        if (!files.length) {
            status.textContent = '先に画像を選択してください';
            return;
        }
        status.textContent = '判定中...';
        const formData = new FormData();
        formData.append('image', files[0]);
        formData.append('csrf_token', '{{ csrf_token() }}');
        fetch('/analyze_image', { method: 'POST', body: formData })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.error) {
                    status.textContent = data.error;
                    return;
                }
                if (data.category) document.querySelector('select[name="category"]').value = data.category;
                if (data.season) {
                    document.querySelectorAll('#season-checklist input[name="season"]').forEach(function (cb) {
                        if (cb.value === data.season) cb.checked = true;
                    });
                }
                if (data.color) colorInput.value = data.color;
                status.textContent = '判定結果を反映しました';
            })
            .catch(function () {
                status.textContent = 'AI解析に失敗しました';
            });
    });
    {% endif %}
})();
</script>
